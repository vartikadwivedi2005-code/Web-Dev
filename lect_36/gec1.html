<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoisting Demo</title>
</head>
<body>
    <script>
        // 1. var is hoisted and initialized as 'undefined'
        console.log("Value of a:", a); 
        var a = 10;

        // 2. let and const are hoisted but NOT initialized
        // This period is called the "Temporal Dead Zone" (TDZ)
        try {
            console.log(b); 
        } catch (e) {
            console.log("Error accessing b:", e.message);
        }

        let b = 20;
        const c = 30;

        console.log("Value of b after declaration:", b);
        console.log("Value of c:", c);

        // 3. Function declarations are fully hoisted
        console.log(greet());

        function greet() {
            return "Hello! I am fully hoisted.";
        }

        /* 
           HOISTING SUMMARY:
           - var: Declaration is moved to top, initialized as 'undefined'.
           - let/const: Declaration is moved to top, but remains uninitialized (TDZ).
           - functions: The entire function body is moved to the top.
        */
    </script>
</body>
</html>
